name: CI/CD pipeline
on:
  push:
    branches:
      - 'master'
      - 'dev'

jobs:
  deploy:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Determine the tag based on the branch dev/master
      - name: Set Docker Hub Image Tag
        id: docker_tag
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/master" ]]; then
            echo "::set-output name=tag::latest"
          elif [[ "${{ github.ref }}" == "refs/heads/dev" ]]; then
            echo "::set-output name=tag::dev"
          fi


      - name: Build and push Docker image without cache
        run: docker build --no-cache -t touchvaske/comming-soon:${{ steps.docker_tag.outputs.tag }} .

      - name: Push Docker image
        run: docker push touchvaske/comming-soon:${{ steps.docker_tag.outputs.tag }}